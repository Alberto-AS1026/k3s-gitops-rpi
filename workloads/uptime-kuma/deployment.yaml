apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    app.kubernetes.io/name: uptime-kuma
spec:
  replicas: 1
  # Recreate: primero se para el pod viejo y luego arranca el nuevo.
  # Con un disco ReadWriteOnce y SQLite, nunca debe haber dos pods escribiendo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uptime-kuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uptime-kuma
    spec:
      # Evita que Kubernetes inyecte variables como UPTIME_KUMA_PORT=tcp://...
      # (por el Service "uptime-kuma"), que Uptime Kuma confundiría con su puerto.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # usuario "node" de la imagen rootless
        runAsGroup: 1000
        fsGroup: 1000            # el volumen pertenece a este grupo
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.5.11-slim-rootless
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: UPTIME_KUMA_DB_TYPE
              value: sqlite      # sin asistente inicial de base de datos
            - name: TZ
              value: Europe/Madrid
          resources:
            requests:            # lo que se garantiza al pod
              cpu: 100m
              memory: 192Mi
            limits:              # el techo: más memoria = OOMKilled; más CPU = se frena
              cpu: "1"
              memory: 512Mi
          # startupProbe: margen de hasta 5 min para el primer arranque
          # (crea la base de datos en la microSD).
          startupProbe:
            httpGet:
              path: /api/entry-page
              port: http
            periodSeconds: 10
            failureThreshold: 30
          # readinessProbe: si falla, el pod deja de recibir tráfico.
          readinessProbe:
            httpGet:
              path: /api/entry-page
              port: http
            periodSeconds: 10
          # livenessProbe: si falla 3 veces seguidas, se reinicia el contenedor.
          livenessProbe:
            httpGet:
              path: /api/entry-page
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
